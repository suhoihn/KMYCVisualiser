spring:
  application:
    name: kmy-visualiser-backend
  mvc:
    async:
      request-timeout: 75s

server:
  port: ${PORT:8080}

kmy:
  runner-url: ${KMY_RUNNER_URL:http://127.0.0.1:8090}
  compiler:
    path: ${KMY_COMPILER_PATH:../../RemoteProjects/kmyc.exe}
    timeout: 5s
    max-source-length: 100000

