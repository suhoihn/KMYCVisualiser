map "$request_method:$request_uri" $kmy_submission {
    default 0;
    ~^POST:/kmy/api/playground(?:\?|$) 1;
}

log_format kmy_submission 'kmy_submit time=$time_iso8601 client=$remote_addr '
                          'status=$status seconds=$request_time bytes=$body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location = /kmy {
        return 308 /kmy/;
    }

    location ^~ /kmy/ {
        access_log /var/log/nginx/access.log kmy_submission if=$kmy_submission;
        # Re-resolve the service after Compose replaces its container.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $kmy_upstream kmy-web:8080;
        rewrite ^/kmy(/.*)$ $1 break;
        proxy_pass http://$kmy_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 90s;
        client_max_body_size 128k;
    }
}
