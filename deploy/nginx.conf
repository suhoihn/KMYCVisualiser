worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 128k;
  # Only the personal-site proxy on the dedicated VPS network can supply this header.
  set_real_ip_from 172.30.88.2;
  real_ip_header X-Real-IP;
  limit_req_zone $binary_remote_addr zone=submissions:1m rate=10r/m;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { return 404; }
    location = /api/playground {
      limit_req zone=submissions burst=4 nodelay;
      limit_req_status 429;
      proxy_pass http://backend:8080;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 75s;
    }
  }
}
