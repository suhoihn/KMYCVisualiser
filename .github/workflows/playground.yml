name: KMY playground

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test the Linux compiler
        run: |
          docker run --rm --mount "type=bind,source=$PWD,target=/src" -w /src ubuntu:22.04 bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends g++ python3
            bash compiler/build-linux.sh
            KMYC=/src/release/linux-x86_64/kmyc bash compiler/tests/run-linux-tests.sh --run
            KMY_COMPILER_PATH=/src/release/linux-x86_64/kmyc python3 runner/test_integration.py
          '
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test and build Spring
        working-directory: backend
        run: bash gradlew --no-daemon test bootJar
      - name: Build Docker images and test compile-only mode
        run: |
          docker compose --profile build build
          docker compose up -d --no-build --wait
          python3 deploy/smoke.py
      - name: Test native output and parser replay
        run: |
          docker compose down
          KMY_EXECUTION_MODE=run docker compose up -d --no-build --wait
          python3 deploy/smoke.py --run
          KMY_TEST_API=http://127.0.0.1:8088 npm --prefix frontend run check:replay
      - name: Stop test services
        if: always()
        run: |
          docker compose logs --tail=50
          docker compose down
      - name: Publish tested images and generate release manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p deployment
          cp compose.yaml deploy/deploy.sh deploy/smoke.py deployment/
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for component in web backend runner job; do
            image="$repo-$component"
            tag="$image:$GITHUB_SHA"
            docker tag "kmy-$component:local" "$tag"
            docker push "$tag"
            digest=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "${image}@")
            [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
            printf 'KMY_%s_IMAGE=%s\n' "${component^^}" "$digest" >> deployment/images.env
          done
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: deployment
          path: deployment/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: kmy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment
          path: deployment
      - name: Deploy the tested release over SSH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; skipping this deployment.'
            exit 0
          fi
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          umask 077
          # GitHub secrets may have been pasted from a Windows editor.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          if ! fingerprint=$(ssh-keygen -y -P '' -f "$ssh_dir/key" | ssh-keygen -lf -); then
            echo '::error::VPS_SSH_KEY must contain the complete, unencrypted deploy private key.'
            exit 1
          fi
          echo "Deploy key fingerprint: $fingerprint"
          opts=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          target="$VPS_USER@$VPS_HOST"
          release="kmy-deploy/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${opts[@]}" "$target" "mkdir -p '$release'"
          scp "${opts[@]}" deployment/{compose.yaml,deploy.sh,smoke.py,images.env} "$target:$release/"
          ssh "${opts[@]}" "$target" "bash '$release/deploy.sh'"
